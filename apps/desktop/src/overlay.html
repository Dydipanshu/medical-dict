<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src blob:" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; user-select: none; }
      .pill {
        display: flex; align-items: center; gap: 12px;
        margin: 8px; height: 48px; padding: 0 8px 0 16px; border-radius: 14px;
        background: #000; color: #fff; box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.55);
      }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #8a8a86; flex: none; }
      .pill[data-state="listening"] .dot { background: #e5322d; animation: pulse 1.4s infinite; }
      .pill[data-state="busy"] .dot { background: #e5322d; opacity: 0.5; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .pill[data-state="listening"] .dot { animation: none; } }
      .text { flex: 1; min-width: 0; }
      .status { font-size: 14px; font-weight: 600; line-height: 1.2; }
      .hint { font-size: 11px; opacity: 0.6; }
      .meter-track { width: 56px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      .meter { height: 100%; background: #e5322d; transform-origin: left; transform: scaleX(0); transition: transform 0.1s linear; }
      button { width: 32px; height: 32px; border-radius: 9px; border: none; background: #fff; color: #000; cursor: pointer; display: grid; place-items: center; }
      button:hover { background: #e9e9e6; }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" data-state="idle">
      <span class="dot"></span>
      <div class="text">
        <div class="status" id="status">Ready</div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="meter-track"><div class="meter" id="meter"></div></div>
      <button id="stop" title="Stop dictation" aria-label="Stop dictation">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" rx="2" fill="currentColor" /></svg>
      </button>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
